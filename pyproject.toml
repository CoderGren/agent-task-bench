[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-task-bench"
version = "0.1.0"
description = "Compare OpenAI-compatible local LLMs on tool-calling and small software-engineering agent tasks."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Glen Burchfield" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agent-task-bench = "agent_task_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
